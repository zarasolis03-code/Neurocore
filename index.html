<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEUROCORE SINGULARITY v3.1</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; padding: 20px; text-align: center; }
        .glitch { font-size: 24px; font-weight: bold; text-shadow: 2px 2px #ff0000; margin-bottom: 20px; }
        input { background: #050505; border: 1px solid #00ff41; color: #00ff41; padding: 15px; width: 80%; margin: 10px 0; font-size: 16px; outline: none; }
        .btn { background: #00ff41; color: #000; border: none; padding: 15px; width: 85%; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px #00ff41; }
        #miner-ui { display: none; }
        .stats { border: 1px solid #00ff41; padding: 10px; margin-top: 20px; text-align: left; background: rgba(0,255,65,0.1); }
        .console { height: 200px; overflow: hidden; font-size: 10px; color: #fff; text-align: left; border-top: 1px solid #333; margin-top: 10px; padding-top: 5px; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="glitch">SYSTEM LOCKED</div>
        <p>Enter Private Access Key:</p>
        <input type="password" id="key" placeholder="Type password...">
        <br>
        <button class="btn" onclick="unlock()">DECRYPT & ENTER</button>
    </div>

    <div id="miner-ui">
        <div class="glitch">NEUROCORE ACTIVE</div>
        <div class="stats">
            <div>NODE: <span style="color:#fff;">BTC_MAINNET</span></div>
            <div>HASH: <span id="h">0</span> TH/s</div>
            <div>WALLETS FOUND: <span id="w">0</span></div>
        </div>
        <div class="console" id="log"></div>
    </div>

    <script>
        function unlock() {
            const pass = document.getElementById('key').value;
            // Твојата лозинка е тука
            if(pass === "lol420f*ckthePOLICE!*:)") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('miner-ui').style.display = 'block';
                startMining();
            } else {
                alert("INVALID KEY. ACCESS DENIED.");
            }
        }

        function startMining() {
            const log = document.getElementById('log');
            setInterval(() => {
                let hashrate = (Math.random() * 400 + 900).toFixed(2);
                document.getElementById('h').innerText = hashrate;
                
                let line = document.createElement('div');
                line.innerHTML = `> Scanning block ${Math.random().toString(16).slice(2,10)}... <span style="color:red">No Key Found</span>`;
                log.appendChild(line);
                if(log.childNodes.length > 10) log.removeChild(log.childNodes[0]);
            }, 800);
        }
    </script>
</body>
</html>
